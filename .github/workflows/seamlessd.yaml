name: Build seamless windows compositor

# Builds the static caker-seamlessd (seamlessd/ of this repository) for each Linux architecture.
# The agent embeds it with the XKB data it compiles its keymap from (linux/pkg/seamless/assets/<arch>/caker-seamlessd
# and xkb/), so a guest needs nothing but the agent.

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      BASE_VERSION: ${{ vars.BASE_VERSION || '1.0' }}
    steps:
      - name: checkout cakeagent
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build static compositor (Alpine, musl)
        run: |
          # The release of the agent that embeds it, computed as release.yaml and linux.yaml do (a v* tag build uses its tag).
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF##*/}"
          else
            VERSION="v${BASE_VERSION}.$(git rev-list --count HEAD)"
          fi
          docker build -f scripts/seamlessd.Dockerfile --build-arg SEAMLESSD_VERSION="${VERSION}" --output type=local,dest=out .
          file out/caker-seamlessd
          ls -l out/caker-seamlessd
          test -s out/xkb/rules/evdev

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: seamlessd-${{ matrix.arch }}
          path: out
          if-no-files-found: error
