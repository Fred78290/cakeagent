name: Build seamless windows compositor

# Builds the static caker-seamlessd (seamlessd/ of this repository) for each Linux architecture.
# The agent embeds it with the XKB data it compiles its keymap from (linux/pkg/seamless/assets/<arch>/caker-seamlessd
# and xkb/), so a guest needs nothing but the agent.

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: checkout cakeagent
        uses: actions/checkout@v7

      - name: Build static compositor (Alpine, musl)
        run: |
          docker build -f scripts/seamlessd.Dockerfile --output type=local,dest=out .
          file out/caker-seamlessd
          ls -l out/caker-seamlessd
          test -s out/xkb/rules/evdev

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: seamlessd-${{ matrix.arch }}
          path: out
          if-no-files-found: error
