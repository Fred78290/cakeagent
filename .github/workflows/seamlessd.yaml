name: Build seamless windows compositor

# Builds the static caker-seamlessd (Tools/SeamlessCompositor of the caker repository) for each Linux architecture.
# The agent embeds it (linux/pkg/seamless/assets/<arch>/caker-seamlessd), so a guest needs nothing but the agent.

on:
  workflow_call:
    inputs:
      caker_ref:
        description: Ref of Fred78290/caker providing the compositor source
        type: string
        default: feature/seamless-windows
  workflow_dispatch:
    inputs:
      caker_ref:
        description: Ref of Fred78290/caker providing the compositor source
        type: string
        default: feature/seamless-windows

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: checkout cakeagent
        uses: actions/checkout@v6

      - name: checkout compositor source
        uses: actions/checkout@v6
        with:
          repository: Fred78290/caker
          ref: ${{ inputs.caker_ref }}
          path: caker
          sparse-checkout: Tools/SeamlessCompositor

      - name: Build static compositor (Alpine, musl)
        run: |
          docker build -f scripts/seamlessd.Dockerfile \
            --build-context compositor=caker/Tools/SeamlessCompositor \
            --output type=local,dest=out .
          file out/caker-seamlessd
          ls -l out/caker-seamlessd

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: seamlessd-${{ matrix.arch }}
          path: out/caker-seamlessd
          if-no-files-found: error
