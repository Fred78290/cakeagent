name: Build Prerealase CakeAgent
on:
  push:
    branches:
    - 'master'
    tags:
      - 'ci-linux'
      - 'ci-release'
  pull_request:
    branches:
    - 'master'

env:
  BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
  P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
  KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
  APPLE_ID: ${{ secrets.APPLE_ID }}
  TEAM_ID: ${{ secrets.TEAM_ID }}
  APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  BASE_VERSION: ${{ vars.BASE_VERSION || '1.0' }}

jobs:
  seamlessd:
    uses: ./.github/workflows/seamlessd.yaml

  build:
    needs: seamlessd
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26

      - name: Download the seamless windows compositor
        uses: actions/download-artifact@v8
        with:
          name: seamlessd-amd64
          path: linux/pkg/seamless/assets/amd64

      - name: Download the seamless windows compositor (arm64)
        uses: actions/download-artifact@v8
        with:
          name: seamlessd-arm64
          path: linux/pkg/seamless/assets/arm64

      - name: Build Go binary
        run: |
          mkdir -p _artifacts
          pushd linux
          VERSION="v${BASE_VERSION}.$(git rev-list --count HEAD)"
          BUILD_DATE=`date +%Y-%m-%dT%H:%M:%SZ`
          LDFLAGS="-s -w -X github.com/Fred78290/cakeagent/version.VERSION=${VERSION} -X github.com/Fred78290/cakeagent/version.BUILD_DATE=${BUILD_DATE}"
          GOARCH=amd64 GOOS=linux go build -ldflags="${LDFLAGS}" -o ../_artifacts/cakeagent-linux-amd64
          GOARCH=arm64 GOOS=linux go build -ldflags="${LDFLAGS}" -o ../_artifacts/cakeagent-linux-arm64
          GOARCH=amd64 GOOS=darwin go build -ldflags="${LDFLAGS}" -o ../_artifacts/cakeagent-darwin-amd64
          GOARCH=arm64 GOOS=darwin go build -ldflags="${LDFLAGS}" -o ../_artifacts/cakeagent-darwin-arm64
          GOARCH=amd64 GOOS=windows go build -ldflags="${LDFLAGS}" -o ../_artifacts/cakeagent-windows-amd64.exe
          GOARCH=arm64 GOOS=windows go build -ldflags="${LDFLAGS}" -o ../_artifacts/cakeagent-windows-arm64.exe
          popd
    
      - name: "Create linux prerelease"
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ci-linux')
        run: |
          VERSION="v${BASE_VERSION}.$(git rev-list --count HEAD)"
          SHA="$(git rev-parse HEAD)"
          # --target only applies when the tag is created; an existing tag is not moved.
          # Refuse to publish if the tag already exists on a different commit.
          # The peeled (^{}) entry sorts last, so it wins for annotated tags.
          TAG_SHA="$(git ls-remote --tags origin "refs/tags/${VERSION}" "refs/tags/${VERSION}^{}" | awk 'END { print $1 }')"
          if [ -n "${TAG_SHA}" ] && [ "${TAG_SHA}" != "${SHA}" ]; then
            echo "::error::Tag ${VERSION} already exists at ${TAG_SHA}, expected ${SHA}"
            exit 1
          fi
          # ci-linux then ci-release on the same commit share one version: reuse the
          # existing release (refresh its assets) instead of failing on "already exists".
          # Never demote an already promoted release back to a prerelease.
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release upload --clobber "${VERSION}" \
              ./_artifacts/cakeagent-linux-amd64 \
              ./_artifacts/cakeagent-linux-arm64 \
              ./_artifacts/cakeagent-darwin-amd64 \
              ./_artifacts/cakeagent-darwin-arm64 \
              ./_artifacts/cakeagent-windows-amd64.exe \
              ./_artifacts/cakeagent-windows-arm64.exe
          else
            gh release create --prerelease --generate-notes --target "${SHA}" --title "${VERSION}" ${VERSION} \
              ./_artifacts/cakeagent-linux-amd64 \
              ./_artifacts/cakeagent-linux-arm64 \
              ./_artifacts/cakeagent-darwin-amd64 \
              ./_artifacts/cakeagent-darwin-arm64 \
              ./_artifacts/cakeagent-windows-amd64.exe \
              ./_artifacts/cakeagent-windows-arm64.exe
          fi

      - name: "Create linux release"
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ci-release')
        run: |
          VERSION="v${BASE_VERSION}.$(git rev-list --count HEAD)"
          SHA="$(git rev-parse HEAD)"
          # --target only applies when the tag is created; an existing tag is not moved.
          # Refuse to publish if the tag already exists on a different commit.
          # The peeled (^{}) entry sorts last, so it wins for annotated tags.
          TAG_SHA="$(git ls-remote --tags origin "refs/tags/${VERSION}" "refs/tags/${VERSION}^{}" | awk 'END { print $1 }')"
          if [ -n "${TAG_SHA}" ] && [ "${TAG_SHA}" != "${SHA}" ]; then
            echo "::error::Tag ${VERSION} already exists at ${TAG_SHA}, expected ${SHA}"
            exit 1
          fi
          # Promote the prerelease published by ci-linux for this same commit, if any.
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release upload --clobber "${VERSION}" \
              ./_artifacts/cakeagent-linux-amd64 \
              ./_artifacts/cakeagent-linux-arm64 \
              ./_artifacts/cakeagent-darwin-amd64 \
              ./_artifacts/cakeagent-darwin-arm64 \
              ./_artifacts/cakeagent-windows-amd64.exe \
              ./_artifacts/cakeagent-windows-arm64.exe
            gh release edit "${VERSION}" --prerelease=false --latest
          else
            gh release create --latest --generate-notes --target "${SHA}" --title "${VERSION}" ${VERSION} \
              ./_artifacts/cakeagent-linux-amd64 \
              ./_artifacts/cakeagent-linux-arm64 \
              ./_artifacts/cakeagent-darwin-amd64 \
              ./_artifacts/cakeagent-darwin-arm64 \
              ./_artifacts/cakeagent-windows-amd64.exe \
              ./_artifacts/cakeagent-windows-arm64.exe
          fi
